name: ci

on:
  push:
  pull_request:

jobs:
  plugin:
    name: Plugin (Linux, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and build
        working-directory: aegishider-integrated
        run: mvn -B verify
      - name: Upload shaded jar
        uses: actions/upload-artifact@v4
        with:
          name: Aegishider-jar
          path: aegishider-integrated/target/Aegishider-*.jar
          if-no-files-found: error

  platform:
    name: Platform (Node, vitest/workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Catches broken bindings, assets config and unsupported compatibility dates before merge.
      - name: Wrangler deploy dry-run
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/dry-run

  site:
    name: Site (static assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The landing page is plain static HTML: no build step, so validate that every local
      # asset and page reference resolves instead of building it.
      - run: node site/scripts/check-site.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/scan-secrets.mjs
