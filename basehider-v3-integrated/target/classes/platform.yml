# ---------------------------------------------------------------------------
# BaseHider Platform client
#
# Connects this server to a BaseHider Control Platform instance for licence
# leases and optional telemetry. Disabled-by-default networking: set
# api-base-url to enable. The security core never waits for this service and
# never becomes fail-open because of it.
# ---------------------------------------------------------------------------

enabled: true

# Base URL of the platform, without a trailing slash.
# Example: https://platform.example.com
api-base-url: ""

# Product slug registered on the platform.
product: basehider

# Server name reported to the platform for pairing and abuse tracking.
# Leave empty to report "<server software>:<port>" automatically.
server-name: ""

# Optional anti-tamper pin: SHA-256 of the release jar. When set, the plugin
# verifies its own jar at startup and reports integrity.mismatch telemetry on a
# different build. Leave empty to only display the hash in /basehider license status.
integrity:
  jar-sha256: ""

# warn  = verify and report problems but keep the plugin running (recommended
#         for security plugins; default).
# enforce = reserved for deployments that want to act on an invalid licence.
enforcement: warn

# Trial period from first identity creation before a lease is required.
trial-days: 7

# Lease refresh and heartbeat cadence.
lease-refresh-minutes: 60
heartbeat-minutes: 3

# HTTP connect/request timeout.
request-timeout-seconds: 15

# Telemetry is optional and aggregate-only.
telemetry:
  enabled: true
  max-buffer: 500
  batch-max: 50
  flush-seconds: 60
