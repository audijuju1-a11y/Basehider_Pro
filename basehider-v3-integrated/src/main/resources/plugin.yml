name: BaseHider
version: 3.7.0
main: dev.audismp.basehider.BaseHiderPlugin
api-version: '1.21'
description: Server-side anti-ESP / anti-base-ESP / anti-storage-ESP. Packet-level container hiding and fail-closed item/entity visibility.
authors: [AudiSMP]
website: https://basehider-platform.audijuju1.workers.dev
folia-supported: false
softdepend: [packetevents]

commands:
  basehider:
    description: BaseHider administration, status and diagnostics
    usage: /basehider <status|diag|viewer|export|deep|stats|verify|rescan|reload|help>
    permission: basehider.admin
    aliases: [bh]

permissions:
  basehider.bypass:
    description: Player may see hidden blocks and entity-shielded entities normally (grant only to trusted staff; NOT granted to OPs by default)
    default: false
  basehider.admin:
    description: Access to /basehider administration commands
    default: op
    children:
      basehider.admin.license: true
      basehider.admin.diagnostics: true
  basehider.admin.license:
    description: View licence state and print activation codes (/basehider license ...)
    default: op
  basehider.admin.diagnostics:
    description: Run expensive diagnostics such as /basehider rescan
    default: op
